<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3f94">
<title>Verbes</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  --page:#f5f6f8; --paper:#ffffff; --ink:#1a1d26; --muted:#505767; --line:#d9dde6;
  --navy:#1c3f94; --navy-ink:#ffffff; --navy-soft:#e8edf8;
  --know:#1a6b3c; --know-ink:#ffffff; --know-soft:#e6f3ea;
  --miss:#b3261e; --miss-soft:#fbe7e5;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Noto Serif","Droid Serif",Cambria,"Times New Roman",serif;
  --scale:1;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page:#0d1018; --paper:#12151f; --ink:#e8eaf0; --muted:#a3abbd; --line:#2a3042;
    --navy:#8fb0ff; --navy-ink:#0d1018; --navy-soft:#1c2540;
    --know:#6fcf97; --know-ink:#0d1018; --know-soft:#14291d;
    --miss:#ff8a80; --miss-soft:#3a1c1f;
    color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="system"]{
    --page:#0d1018; --paper:#12151f; --ink:#e8eaf0; --muted:#a3abbd; --line:#2a3042;
    --navy:#8fb0ff; --navy-ink:#0d1018; --navy-soft:#1c2540;
    --know:#6fcf97; --know-ink:#0d1018; --know-soft:#14291d;
    --miss:#ff8a80; --miss-soft:#3a1c1f;
    color-scheme:dark;
  }
}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ui);line-height:1.45;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 .72rem var(--ui);border:1px solid currentColor;border-radius:4px;padding:0 .3em;margin-left:.5em;opacity:.7}
@media not all and (hover:hover) and (pointer:fine){ kbd{display:none} .legend{display:none} }
body.no-legend kbd, body.no-legend .legend{display:none}

/* ---------- page layout ---------- */
.screen{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.pagehead{margin:6px 0 14px}
.pagehead h1{font-family:var(--serif);font-weight:600;font-size:2.1rem;color:var(--navy);letter-spacing:-.01em}
.lede{margin:6px 0 0;color:var(--muted)}
.btnrow{display:flex;gap:8px;align-items:center}
.btnrow.wrap{flex-wrap:wrap}
.primary,.ghost,.danger{border-radius:10px;min-height:44px;padding:0 16px;font-weight:650;border:1.5px solid transparent}
.primary{background:var(--navy);color:var(--navy-ink)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.danger{background:transparent;border-color:var(--miss);color:var(--miss)}
.sm{min-height:40px;padding:0 13px;font-size:.92rem}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.linkbtn.sm{font-size:.85rem;padding:4px 0}
.tag{font:600 .7rem var(--ui);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:8px;white-space:nowrap}

/* ---------- notices, problems, toast ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--navy-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin:10px 0}
.notice p{margin:0;flex:1}
.notice .x{background:none;border:0;color:inherit;font-size:1.3rem;line-height:1;padding:2px 6px}
.problems{background:var(--navy-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin:10px 0}
.problems summary{font-weight:650;cursor:pointer}
.problems ul{margin:8px 0 2px;padding-left:20px}
.problems li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.fatal{max-width:640px;margin:40px auto;padding:20px;background:var(--navy-soft);color:var(--ink);border-radius:12px}
.fatal h1{font-family:var(--serif);margin-bottom:10px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:58px;background:none;border:0;color:var(--muted);font-weight:650;font-size:.88rem}
.tabs button[aria-current="page"]{color:var(--navy);box-shadow:inset 0 3px 0 var(--navy)}

/* ---------- library ---------- */
.lib{margin:22px 0 8px}
.libhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--navy)}
.libhead h2{font-family:var(--serif);font-weight:600;font-size:1.45rem}
.libhead h3{font-size:1.05rem;font-weight:700}
.libhead.sub{border-bottom:1px solid var(--line);padding-bottom:8px}
.count{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.subsec{margin:16px 0 4px 0;padding-left:12px;border-left:2px solid var(--line)}
.vlist{list-style:none;margin:8px 0 0;padding:0}
.vchip{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 12px;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.vchip .vfr{font-family:var(--serif);font-size:1.2rem}
.vchip .ven{grid-column:1;color:var(--muted);font-size:.9rem;font-weight:400}
.vchip .vstat{grid-column:2;grid-row:1 / span 2;align-self:center;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--navy-soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.resume p{margin:0}
.empty{color:var(--muted);padding:12px 0}

/* ---------- study ---------- */
body.in-study .screen#scr-study{display:flex}
#scr-study{flex-direction:column;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));max-width:720px}
.studybar{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.sprog{flex:1;min-width:0}
.sprog-text{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.sprog-text b{color:var(--ink);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;gap:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.score .k{color:var(--know)} .score .m{color:var(--miss)}
.track{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.fill{height:100%;background:var(--navy);width:0;transition:width .25s}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;min-height:50px;padding:5px 9px;border-radius:10px;border:1px solid var(--line);background:var(--paper);text-align:left;min-width:0}
.qbtn small{font-size:.7rem;color:var(--muted)}
.qbtn b{font-size:.86rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:400px){.qbtn{padding:5px 7px}.qbtn small{font-size:.66rem}.qbtn b{font-size:.8rem}}
.qbtn.on{border-color:var(--navy);background:var(--navy-soft)}
.micnote{margin:8px 2px 0;font-size:.85rem;color:var(--muted)}
.cardwrap{flex:1;display:flex;flex-direction:column;padding:10px 0 4px;min-height:0}
.card{flex:1;position:relative;border-radius:6px;padding:16px 16px 22px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background-color:var(--paper);
  box-shadow:0 0 0 1px var(--line),0 14px 30px -20px rgba(28,46,110,.45)}
.card.enter{animation:cardIn .22s ease-out}
.card.turn{animation:cardTurn .2s ease-out}
.card.fly{transition:transform .2s ease-in,opacity .2s ease-in}
.card.dragging{transition:none}
.card[data-lean="know"]{box-shadow:0 0 0 3px var(--know),0 14px 30px -20px rgba(0,0,0,.4)}
.card[data-lean="miss"]{box-shadow:0 0 0 3px var(--miss),0 14px 30px -20px rgba(0,0,0,.4)}
body.no-anim .card{animation:none !important;transition:none !important}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardTurn{from{opacity:.4;transform:scaleX(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none !important;transition:none !important}.fill{transition:none}}
.ctop{display:flex;align-items:center;min-height:28px;color:var(--muted);font-size:.85rem}
.cbig{margin:22px 0 6px;font-size:2.4rem;line-height:1.15;overflow-wrap:anywhere}
.cbig.fr{font-family:var(--serif);color:var(--navy)}
.cbig.en{font-weight:650}
.cphon{font-size:1.15rem;color:var(--muted);margin:2px 0}
.cen{font-size:1.25rem;font-weight:600;margin:8px 0 2px}
.cask{color:var(--muted);margin:14px 0 0;font-size:.95rem}
.cnote{color:var(--muted);margin:10px 0 0;font-size:.9rem}
.cplay{margin:12px 0 4px}
.verdict{margin:14px 0 0;font-weight:650}
.verdict.known{color:var(--know)} .verdict.missed{color:var(--miss)}
.phontap{background:var(--paper);border:1px dashed var(--muted);border-radius:8px;padding:6px 10px;color:var(--muted);margin:4px 0;font-size:.9rem}
.mtitle{margin:12px 0 2px;font-weight:600;font-size:1.5rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.mtitle .fr{font-family:var(--serif);color:var(--navy);font-size:1.9rem}
.mtitle .mtense{font-family:var(--ui);font-size:1.1rem;color:var(--ink)}
.msub{margin:0 0 6px;color:var(--muted)}
.plist{list-style:none;margin:10px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:12px;min-height:32px;font-size:1.1rem}
.plist .pl{font-family:var(--serif);min-width:5.5em}
.plist .dots{color:var(--muted);letter-spacing:.2em}
.rule{margin:10px 0 2px;font-size:.92rem;color:var(--ink);background:var(--navy-soft);border-radius:8px;padding:6px 10px;display:inline-block}
.play{display:inline-flex;align-items:center;gap:6px;min-height:40px;min-width:40px;justify-content:center;padding:0 10px;border-radius:999px;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);font-weight:650;font-size:.9rem}
.play svg{width:20px;height:20px;flex:none}
.play.playing{background:var(--navy);color:var(--navy-ink)}
.microw{display:flex;align-items:flex-start;gap:12px;margin-top:18px}
.micbtn{width:48px;height:48px;flex:none;border-radius:50%;border:2px solid var(--navy);background:var(--paper);color:var(--navy);display:grid;place-items:center}
.micbtn svg{width:22px;height:22px}
.micbtn.on{background:var(--miss);border-color:var(--miss);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent,0 0 0 4px var(--miss-soft)}}
.heard{font-size:.92rem;padding-top:4px;min-width:0;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.heard q{font-family:var(--serif);font-size:1.05rem;quotes:"“" "”"}
.hmsg{color:var(--muted)}
.hb{display:inline-block;font:650 .75rem var(--ui);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.hb.ok{color:var(--know);background:var(--know-soft)}
.hb.close{color:var(--ink);background:var(--navy-soft)}
.hb.no{color:var(--muted);border:1px solid var(--line)}
.actions{display:flex;gap:10px;padding:10px 0 calc(6px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:5;background:var(--page)}
.act{flex:1;min-height:58px;border-radius:12px;font-size:1.05rem;font-weight:700;border:2px solid transparent}
.act.know{background:var(--know);color:var(--know-ink)}
.act.miss{background:var(--paper);color:var(--miss);border-color:var(--miss)}
.act.next,.act.reveal{background:var(--navy);color:var(--navy-ink)}
.legend{margin:8px 0 0;text-align:center;color:var(--muted);font-size:.8rem}
.legend kbd{margin:0 .25em 0 .8em}

/* ---------- conjugation tables ---------- */
.conj{width:100%;border-collapse:collapse;margin:8px 0 4px}
.conj th{text-align:left;font:600 .75rem var(--ui);color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.conj td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.card .conj td{background:color-mix(in srgb,var(--paper) 86%,transparent)}
.c-p{color:var(--muted);font-size:.9rem;white-space:nowrap}
.c-fr{font-family:var(--serif);font-size:1.12rem}
.c-ph{color:var(--muted);font-size:.9rem}
.c-en{font-size:.92rem}
.c-pl{width:48px;text-align:right}
.c-pl .play{min-height:36px;min-width:36px;padding:0}
.c-m{width:30px;font-weight:800;color:var(--know);text-align:center}
.end{color:var(--navy);font-weight:700}
.markable tbody tr{cursor:pointer}
.card .markable tr.wrong td{background:var(--miss-soft)}
.markable tr.wrong .c-m{color:var(--miss)}
@media (max-width:560px){
  .conj thead{display:none}
  .conj,.conj tbody{display:block}
  .conj tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"m p pl" "m fr pl" "m en pl" "m ph pl";column-gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .conj:not(.markable) tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"p pl" "fr pl" "en pl" "ph pl"}
  .conj td{display:block;padding:0;border:0}
  .card .conj tr{background:color-mix(in srgb,var(--paper) 86%,transparent)}
  .card .conj td{background:none}
  .card .markable tr.wrong{background:var(--miss-soft)}
  .card .markable tr.wrong td{background:none}
  .conj .c-m{grid-area:m;align-self:center;width:auto}
  .conj .c-p{grid-area:p;font-size:.78rem}
  .conj.persons .c-p{display:none}
  .conj .c-fr{grid-area:fr}
  .conj .c-ph{grid-area:ph}
  .conj .c-en{grid-area:en}
  .conj .c-pl{grid-area:pl;align-self:center;width:auto}
  .cbig{font-size:2rem}
}

/* ---------- learn ---------- */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--navy-soft);border-radius:12px;padding:10px 12px;margin:4px 0 8px}
.banner p{margin:0;color:var(--muted);font-size:.9rem}
.learnctl{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sel{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
select{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);padding:0 10px;max-width:100%}
.lverb{border-bottom:1px solid var(--line)}
.lrow{width:100%;display:flex;align-items:center;gap:8px;min-height:54px;padding:8px 2px;background:none;border:0;text-align:left}
.lname{flex:1;min-width:0;font-size:1.05rem}
.lfr{font-family:var(--serif);font-size:1.2rem;color:var(--navy)}
.ldash{color:var(--muted)}
.lchev svg{width:22px;height:22px;color:var(--muted);transition:transform .2s}
.lrow[aria-expanded="true"] .lchev svg{transform:rotate(180deg)}
.lbody{padding:4px 0 18px}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vfr{font-family:var(--serif);font-size:2rem;color:var(--navy);line-height:1.1}
.vph{color:var(--muted);font-size:1.05rem}
.ven{font-weight:600}
.vmeta{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.vbtns{margin:10px 0 4px}
.ltense{margin-top:18px}
.lthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lthead h3{font-family:var(--serif);font-weight:600;font-size:1.2rem;margin-right:auto}

/* ---------- guide ---------- */
.gentry{padding:16px 0 20px;border-bottom:1px solid var(--line);scroll-margin-top:12px}
.gentry h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;color:var(--navy)}
.gentry h3{font-size:.95rem;margin:14px 0 4px}
.gentry p{margin:0;max-width:68ch}
.gentry.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--navy-soft)}to{background:transparent}}
.gtable{border-collapse:collapse;width:100%;margin-top:6px}
.gtable th,.gtable td{text-align:left;vertical-align:top;padding:7px 8px 7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.gtable th{white-space:nowrap;font-weight:650}
.gex{font-family:var(--serif);color:var(--navy);white-space:nowrap}
@media (max-width:560px){.gtable tr{display:grid;grid-template-columns:auto 1fr;column-gap:10px;border-bottom:1px solid var(--line);padding:6px 0}.gtable th,.gtable td{border:0;padding:0}.gtable td:last-child{grid-column:2}}

/* ---------- settings ---------- */
.sgroup{margin:20px 0 6px}
.sgroup h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;padding-bottom:8px;border-bottom:2px solid var(--navy);margin-bottom:4px}
.sh3{font-size:1rem;margin:16px 0 8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow.col{flex-direction:column;align-items:stretch}
.stext{flex:1;min-width:0}
.slabel{font-weight:650;display:block}
.shelp{margin:3px 0 0;color:var(--muted);font-size:.88rem}
.switch{flex:none;width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--navy)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:.92rem}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);font-weight:650}
input[type=range]{width:100%;accent-color:var(--navy);min-height:36px}
details.shelpbox{margin:10px 0;color:var(--muted);font-size:.9rem}
details.shelpbox summary{cursor:pointer;color:var(--navy);font-weight:600}
details.shelpbox p{margin:8px 0}

/* ---------- dialogs ---------- */
dialog{border:0;border-radius:14px;padding:20px;max-width:min(460px,calc(100vw - 24px));width:100%;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,30,.5)}
dialog h2{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin-bottom:10px}
dialog p{margin:8px 0}
dialog fieldset{border:0;margin:10px 0;padding:0}
dialog legend{font-weight:650;margin-bottom:6px;padding:0}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.radio:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.radio input{accent-color:var(--navy);width:18px;height:18px}
.dlgbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.pnote{color:var(--muted);font-size:.88rem}

/* ---------- stage 3: schedule ---------- */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.subnav button{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:.9rem}
.subnav button[aria-current="page"]{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.libnote{margin:0 0 8px;font-size:.88rem;color:var(--muted)}
.rank{font:600 .7rem var(--ui);color:var(--muted);margin-left:8px}
.vchip .vstat{grid-column:1 / -1;grid-row:auto;justify-self:start;margin-top:4px}

    }
  });
</script>
<script src="verbs.js" onerror="window.__verbsMissing = true"></script>
<script>
(function () {
"use strict";

/* =========================================================================
   CONSTANTS AND SMALL HELPERS
   ========================================================================= */
const APP_VERSION = "5.3";
const SCHEMA = 1;
// Storage keys. NEVER rename these: saved progress lives under them.
const KEYS = { settings: "frverbs.settings", progress: "frverbs.progress", schedule: "frverbs.schedule", timing: "frverbs.timing", session: "frverbs.session", formsched: "frverbs.formsched", history: "frverbs.history", lastbackup: "frverbs.lastbackup", sync: "frverbs.sync", syncat: "frverbs.syncat", backup: "frverbs.backup." };
const EXPORT_SCHEMA = 4;
const TYPE_ORDER = ["irregular", "regular"];
const GLOSS = { present: "now, or what usually happens", passe_compose: "finished past: I did, I have done", imparfait: "ongoing past: I was doing, I used to do", futur: "future: I will do", conditionnel: "would: I would do, polite requests" };
const GLOSS_S = { present: "now", passe_compose: "finished past", imparfait: "ongoing past", futur: "future", conditionnel: "would" };
const TYPE_LABEL = { irregular: "Irregular verbs", regular: "Regular verbs" };

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isObj = o => o !== null && typeof o === "object" && !Array.isArray(o);
const filled = s => typeof s === "string" && s.trim() !== "";
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

const ICON = {
  back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a1 1 0 0 0 1.7-.8V5.7a1 1 0 0 0-1.7-.8L8 8.5H5a1 1 0 0 0-1 1z" fill="currentColor"/><path d="M16.5 8.6a4.8 4.8 0 0 1 0 6.8M19 6.2a8.4 8.4 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  mic: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15z" fill="currentColor"/><path d="M18.5 11a6.5 6.5 0 0 1-13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  chev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* =========================================================================
   NOTICES AND TOAST
   ========================================================================= */
const notices = [];
function addNotice(text) {
  notices.push({ id: Math.random().toString(36).slice(2), text });
  renderNotices();
}
function renderNotices() {
  $$(".notices").forEach(box => {
    box.innerHTML = notices.map(n => `<div class="notice" role="status"><p>${esc(n.text)}</p><button class="x" data-dismiss="${n.id}" aria-label="Dismiss">×</button></div>`).join("");
  });
}
let toastTimer = null;
function toast(text) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* =========================================================================
   STORAGE (every read and write is wrapped)
   ========================================================================= */
let storageWarned = false, writeWarned = false;
function lsGet(k) {
  try { return localStorage.getItem(k); }
  catch (e) {
    if (!storageWarned) { storageWarned = true; addNotice("This browser is blocking saved data, so progress and settings will be lost when you close the page."); }
    return null;
  }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); return true; }
  catch (e) {
    if (!writeWarned) { writeWarned = true; addNotice("Your progress couldn’t be saved in this browser (storage is full or blocked). Export a backup from Settings to keep it."); }
    return false;
  }
}
function lsRemove(k) { try { localStorage.removeItem(k); } catch (e) {} }
function stamp() { return new Date().toISOString().replace(/[:.]/g, "-"); }
function makeBackup(label, raw) {
  if (raw == null) return null;
  const k = KEYS.backup + label + "." + stamp();
  lsSet(k, raw);
  pruneBackups();
  return k;
}
function pruneBackups() {
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(KEYS.backup) === 0) ks.push(k); }
    const when = k => k.slice(k.lastIndexOf(".") + 1);
    ks.sort((a, b) => (when(a) < when(b) ? 1 : -1));
    ks.slice(3).forEach(lsRemove);
  } catch (e) {}
}

/* ---------- settings ---------- */
const DEFAULTS = {
  autoplay: true, direction: "en-fr", phonetics: "always", mic: true,
  voice: "", rate: 0.9, theme: "system", textSize: 1,
  repeatAudio: 1, repeatPile: true, swipe: true, haptics: true, animations: true, keyLegend: true,
  practiseContent: "main", practiseOrder: "order",
  budgetMin: 20, maxNew: 8, maxNewIrr: 2, tenseEvery: ["present"], regTables: 2, allowedWrong: 1,
  secondPass: true, schedDir: "en-fr", sectionOrder: ["irregular", "er", "ir", "re"],
  reviewStyle: "prompts", prompts: 3, listening: true,
  budgetIrr: 20, budgetReg: 10, maxNewForms: 20, autoBackup: true
};
const CHOICES = {
  direction: ["en-fr", "fr-en", "mixed"], phonetics: ["always", "tap", "hidden"], theme: ["system", "light", "dark"],
  textSize: [0, 1, 2, 3], repeatAudio: [1, 2], practiseContent: ["main", "key", "full"], practiseOrder: ["order", "shuffle"],
  budgetMin: [10, 15, 20, 25, 30, 40, 60], maxNew: [2, 4, 6, 8, 10, 12], maxNewIrr: [0, 1, 2, 3], regTables: [0, 1, 2, 3],
  budgetIrr: [15, 18, 20], budgetReg: [5, 10, 15], maxNewForms: [10, 15, 20, 25, 30],
  allowedWrong: [0, 1, 2, 3], schedDir: ["en-fr", "follow"], reviewStyle: ["prompts", "tables"], prompts: [2, 3, 4, 5]
};
const SCALE = [0.9, 1, 1.15, 1.3];
function freshDefaults() { return JSON.parse(JSON.stringify(DEFAULTS)); }
let settings = freshDefaults();

function cleanSettings(o) {
  const s = freshDefaults();
  if (!isObj(o)) return s;
  Object.keys(DEFAULTS).forEach(k => {
    const v = o[k], d = DEFAULTS[k];
    if (v === undefined) return;
    if (CHOICES[k]) { if (CHOICES[k].includes(v)) s[k] = v; }
    else if (Array.isArray(d)) { if (Array.isArray(v) && v.every(x => typeof x === "string")) s[k] = v.slice(); }
    else if (k === "rate") { if (typeof v === "number" && v >= 0.5 && v <= 1.3) s[k] = v; }
    else if (typeof d === "boolean") { if (typeof v === "boolean") s[k] = v; }
    else if (typeof d === "string") { if (typeof v === "string") s[k] = v; }
  });
  return s;
}
function loadSettings() {
  const raw = lsGet(KEYS.settings);
  if (raw == null) return freshDefaults();
  try {
    const o = JSON.parse(raw);
    if (!isObj(o) || typeof o.schema !== "number") throw new Error("bad");
    return cleanSettings(o);
  } catch (e) {
    const k = makeBackup("settings-damaged", raw);
    addNotice(`Your saved settings were damaged, so they’ve been reset to the defaults. The damaged copy is kept in this browser under “${k}”.`);
    return freshDefaults();
  }
}
function saveSettings() { lsSet(KEYS.settings, JSON.stringify(Object.assign({ schema: SCHEMA }, settings))); }

/* ---------- progress: { schema, verbs: { verbId: { cardKey: record } } } ---------- */
let progress = { schema: SCHEMA, verbs: {} };
function loadProgress() {
  const raw = lsGet(KEYS.progress);
  if (raw == null) return { schema: SCHEMA, verbs: {} };
  try {
    const o = JSON.parse(raw);
    if (!isObj(o) || typeof o.schema !== "number" || !isObj(o.verbs)) throw new Error("bad");
    if (o.schema > SCHEMA) throw new Error("newer");
    return o;
  } catch (e) {
    const k = makeBackup("progress-damaged", raw);
    addNotice(`Your saved progress was damaged and couldn’t be read, so it has started fresh. The damaged copy is kept in this browser under “${k}”. If you have an export file, import it from Settings.`);
    return { schema: SCHEMA, verbs: {} };
  }
}
function saveProgress() { lsSet(KEYS.progress, JSON.stringify(progress)); }
function getRec(verbId, key) {
  const v = progress.verbs[verbId];
  return isObj(v) && isObj(v[key]) ? v[key] : null;
}
function ensureRec(verbId, key) {
  if (!isObj(progress.verbs[verbId])) progress.verbs[verbId] = {};
  const v = progress.verbs[verbId];
  if (!isObj(v[key])) v[key] = { seen: 0, known: 0, missed: 0 };
  return v[key];
}

/* =========================================================================
   VERB DATA: LOAD AND VALIDATE
   ========================================================================= */
let TENSE_KEYS = [], PERSONS = [], VERBS_OK = [], BY_ID = {}, PROBLEMS = [], FATAL = "", SECTIONS = [];
let RULESX = {}, AUX = null;
const brokenGroups = new Set();
const rankSeen = new Set();
const rankKey = r => r[0] + parseFloat(r.slice(1));

function checkGroup(G) {
  const e = [];
  if (!isObj(G)) return ["must be { ... }"];
  if (!filled(G.name)) e.push("needs a name");
  if (!filled(G.infinitiveEnding)) e.push("needs infinitiveEnding");
  if (!isObj(G.participle) || typeof G.participle.fr !== "string" || typeof G.participle.phon !== "string") e.push("needs participle: { fr, phon }");
  if (!isObj(G.futureStem) || typeof G.futureStem.drop !== "number" || typeof G.futureStem.phon !== "string") e.push("needs futureStem: { drop, phon }");
  if (!isObj(G.tenses)) { e.push("needs tenses"); return e; }
  TENSE_KEYS.forEach(t => {
    const R = G.tenses[t];
    if (!isObj(R)) { e.push(`has no rule for the tense “${t}”`); return; }
    if (!["stem", "future", "auxiliary"].includes(R.from)) { e.push(`tenses.${t}.from must be "stem", "future" or "auxiliary"`); return; }
    if (R.from === "auxiliary") return;

/* ---------- swipe (main card only) ---------- */
(function () {
  const card = $("#card");
  let sx = 0, sy = 0, dx = 0, t0 = 0, down = false, horiz = null, pid = null;
  card.addEventListener("pointerdown", e => {
    const it = curItem();
    if (!it || !isSingle(it) || !settings.swipe || busy || e.button > 0) return;
    if (e.target.closest("button, a, input, select")) return;
    down = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; t0 = performance.now(); horiz = null;
  });
  card.addEventListener("pointermove", e => {
    if (!down || e.pointerId !== pid) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (horiz === null && (Math.abs(mx) > 10 || Math.abs(my) > 10)) {
      horiz = Math.abs(mx) > Math.abs(my) * 1.2;
      if (horiz) { try { card.setPointerCapture(pid); } catch (_) {} card.classList.add("dragging"); }
    }
    if (!horiz) return;
    dx = mx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
    card.dataset.lean = dx > 40 ? "know" : dx < -40 ? "miss" : "";
  });
  const end = e => {
    if (!down || e.pointerId !== pid) return;
    down = false; card.classList.remove("dragging");
    if (!horiz) return;
    suppressClickUntil = performance.now() + 400;
    const dt = Math.max(1, performance.now() - t0);
    const far = Math.abs(dx) > Math.min(120, card.offsetWidth * 0.3), fast = Math.abs(dx) > 50 && Math.abs(dx) / dt > 0.5;
    if (e.type === "pointerup" && (far || fast)) gradeMain(dx > 0, true);
    else { card.style.transform = ""; card.dataset.lean = ""; }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
})();

const dialogOpen = () => $$("dialog").some(d => d.open);
document.addEventListener("keydown", e => {
  if (currentScreen !== "study" || dialogOpen() || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  const it = curItem(); if (!it) return;
  const k = e.key;
  if (k === " " || k === "Spacebar") { e.preventDefault(); if (!e.repeat) onFlip(); }
  else if (k === "1") { e.preventDefault(); if (!e.repeat) onKnow(); }
  else if (k === "2") { e.preventDefault(); if (!e.repeat) onDont(); }
  else if (/^[3-8]$/.test(k)) { e.preventDefault(); toggleRow(Number(k) - 3); }
  else if (k === "Enter") { if (e.target.closest && e.target.closest("button")) return; e.preventDefault(); if (!e.repeat) onNext(); }
  else if (k === "p" || k === "P") { e.preventDefault(); speak(speakText(it), $("#card .cplay .play")); }
  else if (k === "m" || k === "M") { e.preventDefault(); toggleMic(); }
  else if (k === "u" || k === "U" || k === "Backspace") { e.preventDefault(); undo(); }
  else if (k === "Escape") { e.preventDefault(); navigate(homeOf()); }
});

function guideEndings(t) {
  const gs = Object.keys(RULESX).filter(g => !brokenGroups.has(g));
  if (!gs.length) return "";
  const rows = gs.map(g => {
    const G = RULESX[g], R = G.tenses[t];
    let text;
    if (R.from === "auxiliary") text = `avoir or être (présent) + past participle: stem + -${G.participle.fr}`;
    else {
      const stemDesc = R.from === "future" ? (G.futureStem.drop ? `the infinitive minus its last ${G.futureStem.drop === 1 ? "letter" : G.futureStem.drop + " letters"}` : "the whole infinitive") : "stem";
      text = `${stemDesc} + ${PERSONS.map(p => (R.endings[p].fr ? "-" + R.endings[p].fr : "(nothing)")).join(", ")}`;
    }
    const ex = VERBS_OK.find(v => v.type === "regular" && v.group === g && v.tables[t] && v.tables[t].source === "rules");
    return `<tr><th>${esc(G.name)}</th><td>${esc(text)}</td><td>${ex ? `<span class="gex" lang="fr">${esc(ex.tables[t].rows[0].fr)}</span>` : ""}</td></tr>`;
  });
  return `<h3>Regular endings</h3><table class="gtable"><tbody>${rows.join("")}</tbody></table>`;
}
function renderGuide() {
  $("#guideList").innerHTML = TENSE_KEYS.map(t => {
    const T = TENSES[t];
    return `<section class="gentry" id="g-${esc(t)}"><h2>${esc(T.name)}</h2>` +
      (filled(T.formation) ? `<h3>How it’s formed</h3><p>${esc(T.formation)}</p>` : "") +
      (filled(T.use) ? `<h3>When it’s used</h3><p>${esc(T.use)}</p>` : "") + guideEndings(t) + "</section>";
  }).join("");
}

const ABOUT = `<p>This schedule uses the spacing effect: a memory lasts longer when you review it just as it starts to fade, and each successful review lets the next gap grow. Each card is reviewed on fixed days after you first learn it: day 1, 3, 7, 14, 30, 60 and 180, then every 180 days. Those days never move.</p>
<p>The aim is strong long-term memory, not guaranteed 100% recall. A miss never changes the schedule: a missed card goes to the back of the pile and is repeated until you get it right, so every card you review advances that day. If you are late, the next review is due the following day instead.</p>
<p>Irregular verbs: every form (and the infinitive) is its own card with its own schedule, so a form you know moves out to months while a weak one keeps coming back. Cards are shuffled across all verbs, tenses and persons, so you can’t follow a pattern. Forms are introduced in importance order: verb by verb, présent first.</p>
<p>Regular verbs follow rules, so each one has a single card: English to the French infinitive. Full tables are for learning, on the Learn page.</p>
<p>Each card alternates between two directions: speaking (English shown, you say the French) and listening (audio only, you say the meaning). A new card is tested speaking, then listening in the second pass. After that it flips at every review, starting with speaking. A miss repeats the card in the same direction until you get it right. On a listening card you press Show answer to see the French and English, then choose Know or Don’t know. Speaking cards are done first in a session, then listening cards.</p>`;

/* ---------- GitHub sync ---------- */
let syncing = false, syncTimer = null, syncErr = "", syncNotified = false;
const b64 = x => { const b = new TextEncoder().encode(x); let o = ""; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(o); };
const unb64 = x => { const o = atob(x.replace(/\s/g, "")), b = new Uint8Array(o.length); for (let i = 0; i < o.length; i++) b[i] = o.charCodeAt(i); return new TextDecoder().decode(b); };
function syncCfg() { try { const c = JSON.parse(lsGet(KEYS.sync) || "null"); return isObj(c) && c.user && c.repo && c.token ? c : null; } catch (e) { return null; } }
const ghUrl = c => `https://api.github.com/repos/${encodeURIComponent(c.user)}/${encodeURIComponent(c.repo)}/contents/${c.path || "frverbs-data.json"}`;
function ghFetch(c, url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json" }, opts.headers || {});
  opts.cache = "no-store";
  return fetch(url, opts);
}
const okEntry = e => isObj(e) && Number.isInteger(e.step) && e.step >= 0 && e.step <= 8 && isDate(e.due);
function better(a, b) {
  if (!a) return b; if (!b) return a;
  const ea = a.enc || 0, eb = b.enc || 0;
  if (ea !== eb) return ea > eb ? a : b;
  const la = a.lastDate || "", lb = b.lastDate || "";
  if (la !== lb) return la > lb ? a : b;
  return (a.step || 0) >= (b.step || 0) ? a : b;
}
function mergeUnits(L, R) {
  const out = {};
  Object.keys(R || {}).concat(Object.keys(L || {})).forEach(k => { if (k in out) return; const e = better(okEntry(L && L[k]) ? L[k] : null, okEntry(R && R[k]) ? R[k] : null); if (e) out[k] = e; });
  return out;
}
function mergeLogs(L, R) {
  const out = {};
  [L, R].forEach(o => { if (!isObj(o)) return; Object.keys(o).forEach(d => { if (!isDate(d) || !Array.isArray(o[d])) return; out[d] = Array.from(new Set((out[d] || []).concat(o[d].filter(x => typeof x === "string")))); }); });
  return out;
}
function mergeHist(L, R) {
  const out = cleanHist(L), r = cleanHist(R);
  Object.keys(r).forEach(d => {
    out[d] = out[d] || {};
    ["irr", "reg"].forEach(k => {
      if (!r[d][k]) return;
      const a = out[d][k]; if (!a) { out[d][k] = r[d][k]; return; }
      r[d][k].new.forEach(([id, ts]) => { const f = a.new.find(x => x[0] === id); if (f) ts.forEach(t => { if (f[1].indexOf(t) < 0) f[1].push(t); }); else a.new.push([id, ts]); });
      if (typeof r[d][k].n === "number") a.n = Math.max(a.n || 0, r[d][k].n);

}
const syncCore = o => [o.forms, o.verbs, o.fNewLog, o.newLog, o.hist];
const stable = o => JSON.stringify(o, (k, v) => (v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v));
function syncPayload() { return { app: "french-verbs-sync", v: 1, savedAt: new Date().toISOString(), forms: fsched.forms, verbs: schedule.verbs, fNewLog: fsched.newLog, newLog: schedule.newLog, hist }; }
function applyRemote(R) {
  fsched.forms = mergeUnits(fsched.forms, R.forms); schedule.verbs = mergeUnits(schedule.verbs, R.verbs);
  fsched.newLog = mergeLogs(fsched.newLog, R.fNewLog); schedule.newLog = mergeLogs(schedule.newLog, R.newLog);
  hist = mergeHist(hist, R.hist);

function setSyncStatus(m) { const el = $("#syncStatus"); if (el) el.textContent = m; }
function syncIdleText() {
  const c = syncCfg(), at = lsGet(KEYS.syncat);
  return syncErr ? syncErr : c ? `Connected to ${c.user}/${c.repo}.` + (at ? " Last synced " + new Date(at).toLocaleString() + "." : "") : "Not connected.";
}
async function syncNow(why) {
  const c = syncCfg(); if (!c || syncing) return false;
  syncing = true; setSyncStatus("Syncing…");
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await ghFetch(c, ghUrl(c));
      let sha = null, remote = null;
      if (r.status === 404) { /* no file yet */ }
      else if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "GitHub refused the token. Check it hasn’t expired and has Contents: Read and write." : "GitHub error " + r.status);
      else {
        const j = await r.json(); sha = j.sha;
        let txt = j.content ? unb64(j.content) : "";
        if (!txt) { const r2 = await ghFetch(c, ghUrl(c), { headers: { Accept: "application/vnd.github.raw+json" } }); txt = await r2.text(); }
        try { remote = JSON.parse(txt); } catch (e) { throw new Error("The synced file on GitHub is damaged."); }
      }
      if (remote && remote.app === "french-verbs-sync") applyRemote(remote);
      const mine = syncPayload();
      if (!(remote && stable(syncCore(remote)) === stable(syncCore(mine)))) {
        const body = { message: "Verbes sync", content: b64(JSON.stringify(mine)) };
        if (sha) body.sha = sha;
        const p = await ghFetch(c, ghUrl(c), { method: "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });
        if (p.status === 409 || p.status === 422) continue;
        if (!p.ok) throw new Error(p.status === 404 ? "Repository not found, or the token can’t write to it." : p.status === 401 || p.status === 403 ? "GitHub refused the token. Check it has Contents: Read and write." : "GitHub error " + p.status);
      }
      lsSet(KEYS.syncat, new Date().toISOString()); syncErr = ""; syncNotified = false;
      setSyncStatus(syncIdleText());
      return true;
    }
    throw new Error("Two devices wrote at once. Try again.");
  } catch (e) {
    syncErr = e instanceof TypeError ? "Offline. Your progress is safe on this device and will sync later." : "Sync failed: " + (e && e.message ? e.message : e);
    setSyncStatus(syncErr);
    if (!(e instanceof TypeError) && !syncNotified) { syncNotified = true; addNotice(syncErr + " (Settings > Sync)"); }
    return false;
  } finally { syncing = false; }
}
function syncSoon() { if (!syncCfg()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow("auto"), 20000); }
function syncHTML() {

  return `<section class="sgroup"><h2>Sync between devices (GitHub)</h2><p class="shelp">Keeps your progress the same on your laptop and phone, using a private GitHub repository you own. Voice and display settings stay separate on each device. Use one device at a time.</p>` +
    f("syUser", "GitHub username") + f("syRepo", "Repository name") + f("syToken", "Access token", "password") +
    `<div class="btnrow wrap" style="margin-top:10px"><button class="primary sm" id="syncSave">Save and sync</button><button class="ghost sm" id="syncNow">Sync now</button><button class="ghost sm" id="syncOff">Disconnect</button></div><p class="shelp" id="syncStatus"></p>` +
    `<details class="shelpbox"><summary>How to set this up (about 5 minutes)</summary>` +
    `<p><b>1. Make the repository.</b> On github.com press + then New repository. Name it <b>verbs-data</b>, choose <b>Private</b>, tick <b>Add a README file</b>, then Create repository.</p>` +
    `<p><b>2. Make a token.</b> Click your profile picture, then Settings, then Developer settings, then Personal access tokens, then Fine-grained tokens, then Generate new token. Name it Verbes and pick the longest expiry allowed. Under Repository access choose <b>Only select repositories</b> and pick verbs-data. Under Repository permissions set <b>Contents</b> to <b>Read and write</b>. Generate the token and copy it now; GitHub shows it only once.</p>` +
    `<p><b>3. Connect.</b> Type your username, verbs-data and the token above, then press Save and sync. Do the same on your other device.</p>` +
    `<p>The token stays on that device and is never put in backup files. If a device is lost, delete the token on GitHub. When a token expires, make a new one and paste it here.</p></details></section>`;
}
function refreshSyncUI() {
  const c = syncCfg();
  if ($("#syUser") && c && !$("#syUser").value) { $("#syUser").value = c.user; $("#syRepo").value = c.repo; $("#syToken").placeholder = "Saved on this device"; }
  setSyncStatus(syncIdleText());
  const ds = daysSince(lsGet(KEYS.lastbackup));
  if ($("#backupInfo")) $("#backupInfo").textContent = "Last backup: " + (ds === 999 ? "never" : ds === 0 ? "today" : ds + " days ago") + ".";
}
function wireSync() {
  $("#settingsBody").addEventListener("click", async e => {
    if (e.target.closest("#syncSave")) {
      const old = syncCfg(), user = $("#syUser").value.trim(), repo = $("#syRepo").value.trim(), tok = $("#syToken").value.trim() || (old ? old.token : "");
      if (!user || !repo || !tok) { setSyncStatus("Fill in the username, repository name and token."); return; }
      lsSet(KEYS.sync, JSON.stringify({ user, repo, token: tok, path: "frverbs-data.json" })); $("#syToken").value = "";

      if (await syncNow("manual")) toast("Synced.");

/* =========================================================================
   NAVIGATION
   ========================================================================= */
let currentScreen = "";
const SCREENS = ["today", "library", "study", "summary", "learn", "guide", "progress", "stats", "settings"];
const TAB_OF = { today: "today", library: "library", learn: "library", guide: "library", progress: "library", stats: "stats", settings: "settings" };
document.addEventListener("input", e => { if (e.target && e.target.id === "learnSearch") renderLearnList(); });
function showScreen(name) {
  if (currentScreen === "study" && name !== "study") { stopSpeech(); stopListening(); }
  SCREENS.forEach(s => { $("#scr-" + s).hidden = s !== name; });
  currentScreen = name;
  const full = name === "study" || name === "summary";
  $("#tabs").hidden = full;
  document.body.classList.toggle("in-study", name === "study");
  $$("#tabs [data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === TAB_OF[name] ? "page" : "false"));
  $$(".subnav [data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === name ? "page" : "false"));
}
function navigate(name, extra) {
  const st = Object.assign({ screen: name }, extra || {});
  try { history.pushState(st, ""); } catch (e) {}
  route(st);
}
function route(st) {
  st = st || {};
  let name = SCREENS.includes(st.screen) ? st.screen : "library";
  if (name === "study" && !curItem()) name = session && session.mode === "sched" ? "today" : (session && session.done ? "summary" : "library");
  if (name === "summary" && !(session && session.mode !== "sched" && session.done)) name = curItem() ? "study" : "today";
  if (name === "today") renderToday();
  else if (name === "stats") renderStats();
  else if (name === "library") renderLibrary();
  else if (name === "study") renderStudy(false);
  else if (name === "summary") renderSummary();
  else if (name === "learn") renderLearn(st);
  else if (name === "guide") renderGuide();
  else if (name === "progress") renderProgress();
  else if (name === "settings") syncSettingsUI();
  showScreen(name);
  if (name === "learn" && st.verb && document.getElementById("lv-" + st.verb)) {
    document.getElementById("lv-" + st.verb).scrollIntoView({ block: "start" });
  } else if (name === "guide" && st.tense && document.getElementById("g-" + st.tense)) {
    const el = document.getElementById("g-" + st.tense);
    el.scrollIntoView({ block: "start" });
    if (animOn()) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  } else window.scrollTo(0, 0);
}
window.addEventListener("popstate", e => route(e.state || { screen: "library" }));
document.addEventListener("click", e => { const b = e.target.closest(".tabs [data-tab], .subnav [data-tab]"); if (b && b.dataset.tab !== currentScreen) navigate(b.dataset.tab); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-dismiss]");
  if (b) { const i = notices.findIndex(n => n.id === b.dataset.dismiss); if (i >= 0) notices.splice(i, 1); renderNotices(); }
});

/* =========================================================================
   START
   ========================================================================= */
function showFatal(msg) {
  const f = $("#fatal");
  f.hidden = false;
  f.innerHTML = `<h1>Verbes can’t start</h1><p>${esc(msg)}</p><p>Your saved progress is untouched. Fix the problem and reload the page.</p>`;
  SCREENS.forEach(s => { $("#scr-" + s).hidden = true; });
  $("#tabs").hidden = true;
}
function init() {
  settings = loadSettings();
  progress = loadProgress();
  schedule = loadSchedule();
  fsched = loadForms();
  hist = loadHist();
  timing = loadTiming();
  applyDisplay();
  loadData();
  if (FATAL) { showFatal(FATAL); return; }
  migrateForms();
  SECTIONS = buildSections();
  buildSettings();
  wireSettings();
  wireSched();
  wireSync();
  const raw = loadSessionRaw();
  if (raw) session = restoreSession(raw);
  if (synth) {
    loadVoices();
    if (synth.addEventListener) synth.addEventListener("voiceschanged", loadVoices); else synth.onvoiceschanged = loadVoices;
    [250, 1000, 2500, 5000].forEach(ms => setTimeout(loadVoices, ms));
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  renderNotices();
  try { history.replaceState({ screen: "today" }, ""); } catch (e) {}
  route({ screen: "today" });
  window.addEventListener("storage", e => { if (e.key && e.key.indexOf("frverbs.") === 0 && e.key.indexOf(KEYS.backup) !== 0 && e.key !== KEYS.syncat) addNotice("Verbes seems to be open in another tab. Use one tab at a time, or progress can be overwritten."); });
  setTimeout(() => { if (synth && !voices.length) addNotice("No French voice found on this device yet. See Settings > Voice for how to add one."); }, 6000);
  document.addEventListener("visibilitychange", () => {
    if (!syncCfg()) return;
    if (document.hidden) syncNow("hide"); else syncNow("show").then(() => { if (currentScreen === "today" && !(session && session.mode === "sched" && !session.done)) renderToday(); });
  });
  if (syncCfg()) syncNow("open").then(() => { if (currentScreen === "today") renderToday(); });
  window.addEventListener("error", e => { if (e && e.filename && /verbs\.js/i.test(e.filename)) return; toast("Something went wrong: " + (e.message || "unknown error")); });
}
try { init(); }
catch (e) { showFatal("Something went wrong while starting: " + (e && e.message || e)); }

})();
