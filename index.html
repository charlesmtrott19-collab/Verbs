<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3f94">
<title>Verbes</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
:root{
  --page:#f5f6f8; --paper:#ffffff; --ink:#1a1d26; --muted:#505767; --line:#d9dde6;
  --navy:#1c3f94; --navy-ink:#ffffff; --navy-soft:#e8edf8;
  --know:#1a6b3c; --know-ink:#ffffff; --know-soft:#e6f3ea;
  --miss:#b3261e; --miss-soft:#fbe7e5; --hard:#8a5300;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Noto Serif","Droid Serif",Cambria,"Times New Roman",serif;
  --scale:1;
  /* Phase 8 tokens (4D): 5 type sizes, 3:1 control borders, amber Hard */
  --fs-1:.875rem; --fs-2:1rem; --fs-3:1.25rem; --fs-4:1.75rem; --fs-5:2.5rem;
  --ctl:#7b8396; --hard-soft:#fdf0d5;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page:#0d1018; --paper:#12151f; --ink:#e8eaf0; --muted:#a3abbd; --line:#2a3042;
    --navy:#8fb0ff; --navy-ink:#0d1018; --navy-soft:#1c2540;
    --know:#6fcf97; --know-ink:#0d1018; --know-soft:#14291d;
    --miss:#ff8a80; --miss-soft:#3a1c1f; --hard:#f2c46b; --ctl:#6f7891; --hard-soft:#33270f;
    color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="system"]{
    --page:#0d1018; --paper:#12151f; --ink:#e8eaf0; --muted:#a3abbd; --line:#2a3042;
    --navy:#8fb0ff; --navy-ink:#0d1018; --navy-soft:#1c2540;
    --know:#6fcf97; --know-ink:#0d1018; --know-soft:#14291d;
    --miss:#ff8a80; --miss-soft:#3a1c1f; --hard:#f2c46b; --ctl:#6f7891; --hard-soft:#33270f;
    color-scheme:dark;
  }
}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 var(--fs-1) var(--ui);border:1px solid currentColor;border-radius:4px;padding:0 .3em;margin-left:.5em;opacity:.7}
@media not all and (hover:hover) and (pointer:fine){ kbd{display:none} .legend{display:none} }
body.no-legend kbd, body.no-legend .legend{display:none}

/* ---------- page layout ---------- */
.screen{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.pagehead{margin:6px 0 14px}
.pagehead h1{font-family:var(--serif);font-weight:600;font-size:var(--fs-4);color:var(--navy);letter-spacing:-.01em}
.lede{margin:6px 0 0;color:var(--muted)}
.btnrow{display:flex;gap:8px;align-items:center}
.btnrow.wrap{flex-wrap:wrap}
.primary,.ghost,.danger{border-radius:8px;min-height:44px;padding:0 16px;font-weight:650;border:1.5px solid transparent}
.primary{background:var(--navy);color:var(--navy-ink)}
.ghost{background:transparent;border-color:var(--ctl);color:var(--ink)}
.danger{background:transparent;border-color:var(--miss);color:var(--miss)}
.sm{min-height:44px;padding:0 13px;font-size:var(--fs-1)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.linkbtn.sm{font-size:var(--fs-1);padding:4px 0}
.tag{font:600 var(--fs-1) var(--ui);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:8px;white-space:nowrap}

/* ---------- notices, problems, toast ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--navy-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin:10px 0}
.notice p{margin:0;flex:1}
.notice .x{background:none;border:0;color:inherit;font-size:var(--fs-3);line-height:1;padding:2px 6px}
.problems{background:var(--navy-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin:10px 0}
.problems summary{font-weight:650;cursor:pointer}
.problems ul{margin:8px 0 2px;padding-left:20px}
.problems li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.fatal{max-width:640px;margin:40px auto;padding:20px;background:var(--navy-soft);color:var(--ink);border-radius:12px}
.fatal h1{font-family:var(--serif);margin-bottom:10px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:58px;background:none;border:0;color:var(--muted);font-weight:650;font-size:var(--fs-1)}
.tabs button[aria-current="page"]{color:var(--navy);box-shadow:inset 0 3px 0 var(--navy)}

/* ---------- library ---------- */
.lib{margin:22px 0 8px}
.libhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--navy)}
.libhead h2{font-family:var(--serif);font-weight:600;font-size:var(--fs-3)}
.libhead h3{font-size:var(--fs-2);font-weight:700}
.libhead.sub{border-bottom:1px solid var(--line);padding-bottom:8px}
.count{margin:2px 0 0;color:var(--muted);font-size:var(--fs-1)}
.subsec{margin:16px 0 4px 0;padding-left:12px;border-left:2px solid var(--line)}
.vlist{list-style:none;margin:8px 0 0;padding:0}
.vchip{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 12px;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.vchip .vfr{font-family:var(--serif);font-size:var(--fs-3)}
.vchip .ven{grid-column:1;color:var(--muted);font-size:var(--fs-1);font-weight:400}
.vchip .vstat{grid-column:2;grid-row:1 / span 2;align-self:center;color:var(--muted);font-size:var(--fs-1);font-variant-numeric:tabular-nums}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--navy-soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.resume p{margin:0}
.empty{color:var(--muted);padding:12px 0}

/* ---------- study ---------- */
body.in-study .screen#scr-study{display:flex}
#scr-study{flex-direction:column;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));max-width:720px}
.studybar{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--paper);border:1px solid var(--ctl);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.sprog{flex:1;min-width:0}
.sprog-text{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-1);color:var(--muted)}
.sprog-text b{color:var(--ink);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;gap:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.score .k{color:var(--know)} .score .m{color:var(--miss)}
.track{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.fill{height:100%;background:var(--navy);width:0;transition:width .15s}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;min-height:50px;padding:5px 9px;border-radius:8px;border:1px solid var(--ctl);background:var(--paper);text-align:left;min-width:0}
.qbtn small{font-size:var(--fs-1);color:var(--muted)}
.qbtn b{font-size:var(--fs-1);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:400px){.qbtn{padding:5px 7px}.qbtn small{font-size:var(--fs-1)}.qbtn b{font-size:var(--fs-1)}}
.qbtn.on{border-color:var(--navy);background:var(--navy-soft)}
.micnote{margin:8px 2px 0;font-size:var(--fs-1);color:var(--muted)}
.cardwrap{flex:1;display:flex;flex-direction:column;padding:10px 0 4px;min-height:0;width:100%;max-width:560px;margin:0 auto}
.actions{max-width:560px;margin-left:auto;margin-right:auto;width:100%}
.pagehead.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
@media (min-width:600px){.screen{padding-left:24px;padding-right:24px}}
.card{flex:1;position:relative;border-radius:12px;padding:16px 16px 22px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background-color:var(--paper);
  box-shadow:0 0 0 1px var(--line),0 14px 30px -20px rgba(28,46,110,.45)}
.card.enter{animation:cardIn .15s ease-out}
.card.turn{animation:cardTurn .15s ease-out}
.card.fly{transition:transform .15s ease-in,opacity .15s ease-in}
.card.dragging{transition:none}
.card[data-lean="know"]{box-shadow:0 0 0 3px var(--know),0 14px 30px -20px rgba(0,0,0,.4)}
.card[data-lean="miss"]{box-shadow:0 0 0 3px var(--miss),0 14px 30px -20px rgba(0,0,0,.4)}
body.no-anim .card{animation:none !important;transition:none !important}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardTurn{from{opacity:.4;transform:scaleX(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none !important;transition:none !important}.fill{transition:none}}
.ctop{display:flex;align-items:center;min-height:28px;color:var(--muted);font-size:var(--fs-1)}
.cbig{margin:22px 0 6px;font-size:var(--fs-5);line-height:1.15;overflow-wrap:anywhere}
.cbig.fr{font-family:var(--serif);color:var(--navy)}
.cbig.en{font-weight:650}
.cphon{font-size:var(--fs-3);color:var(--muted);margin:2px 0}
.cen{font-size:var(--fs-3);font-weight:600;margin:8px 0 2px}
.cask{color:var(--muted);margin:14px 0 0;font-size:var(--fs-2)}
.cnote{color:var(--muted);margin:10px 0 0;font-size:var(--fs-1)}
.cplay{margin:12px 0 4px}
.verdict{margin:14px 0 0;font-weight:650}
.verdict.known{color:var(--know)} .verdict.missed{color:var(--miss)}
.phontap{background:var(--paper);border:1px dashed var(--muted);border-radius:8px;padding:6px 10px;color:var(--muted);margin:4px 0;font-size:var(--fs-1)}
.mtitle{margin:12px 0 2px;font-weight:600;font-size:var(--fs-4);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.mtitle .fr{font-family:var(--serif);color:var(--navy);font-size:var(--fs-4)}
.mtitle .mtense{font-family:var(--ui);font-size:var(--fs-2);color:var(--ink)}
.msub{margin:0 0 6px;color:var(--muted)}
.plist{list-style:none;margin:10px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:12px;min-height:32px;font-size:var(--fs-2)}
.plist .pl{font-family:var(--serif);min-width:5.5em}
.plist .dots{color:var(--muted);letter-spacing:.2em}
.rule{margin:10px 0 2px;font-size:var(--fs-1);color:var(--ink);background:var(--navy-soft);border-radius:8px;padding:6px 10px;display:inline-block}
.play{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:0 10px;border-radius:999px;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);font-weight:650;font-size:var(--fs-1)}
.play svg{width:20px;height:20px;flex:none}
.play.playing{background:var(--navy);color:var(--navy-ink)}
.microw{display:flex;align-items:flex-start;gap:12px;margin-top:18px}
.micbtn{width:48px;height:48px;flex:none;border-radius:50%;border:2px solid var(--navy);background:var(--paper);color:var(--navy);display:grid;place-items:center}
.micbtn svg{width:22px;height:22px}
.micbtn.on{background:var(--miss);border-color:var(--miss);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent,0 0 0 4px var(--miss-soft)}}
.heard{font-size:var(--fs-1);padding-top:4px;min-width:0;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.heard q{font-family:var(--serif);font-size:var(--fs-2);quotes:"“" "”"}
.hmsg{color:var(--muted)}
.hb{display:inline-block;font:650 var(--fs-1) var(--ui);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.hb.ok{color:var(--know);background:var(--know-soft)}
.hb.close{color:var(--ink);background:var(--navy-soft)}
.hb.no{color:var(--muted);border:1px solid var(--line)}
.actions{display:flex;gap:10px;padding:10px 0 calc(6px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:5;background:var(--page)}
.act{flex:1;min-height:58px;border-radius:8px;font-size:var(--fs-2);font-weight:700;border:2px solid transparent}
.act.know{background:var(--know);color:var(--know-ink)}
.act.miss{background:var(--paper);color:var(--miss);border-color:var(--miss)}
.act.hard{background:var(--hard-soft);color:var(--ink);border-color:var(--hard)}
.act.next,.act.reveal{background:var(--navy);color:var(--navy-ink)}
.legend{margin:8px 0 0;text-align:center;color:var(--muted);font-size:var(--fs-1)}
.legend kbd{margin:0 .25em 0 .8em}

/* ---------- conjugation tables ---------- */
.conj{width:100%;border-collapse:collapse;margin:8px 0 4px}
.conj th{text-align:left;font:600 var(--fs-1) var(--ui);color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.conj td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.conj tr.asked td{font-weight:700;background:color-mix(in srgb, var(--accent, #2b6cb0) 14%, transparent)}
.card .conj td{background:color-mix(in srgb,var(--paper) 86%,transparent)}
.c-p{color:var(--muted);font-size:var(--fs-1);white-space:nowrap}
.c-fr{font-family:var(--serif);font-size:var(--fs-3)}
.c-ph{color:var(--muted);font-size:var(--fs-1)}
.c-en{font-size:var(--fs-1)}
.c-pl{width:48px;text-align:right}
.c-pl .play{min-height:44px;min-width:44px;padding:0}
.c-m{width:30px;font-weight:800;color:var(--know);text-align:center}
.end{color:var(--navy);font-weight:700}
.markable tbody tr{cursor:pointer}
.card .markable tr.wrong td{background:var(--miss-soft)}
.markable tr.wrong .c-m{color:var(--miss)}
@media (max-width:560px){
  .conj thead{display:none}
  .conj,.conj tbody{display:block}
  .conj tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"m p pl" "m fr pl" "m en pl" "m ph pl";column-gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .conj:not(.markable) tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"p pl" "fr pl" "en pl" "ph pl"}
  .conj td{display:block;padding:0;border:0}
  .card .conj tr{background:color-mix(in srgb,var(--paper) 86%,transparent)}
  .card .conj td{background:none}
  .card .markable tr.wrong{background:var(--miss-soft)}
  .card .markable tr.wrong td{background:none}
  .conj .c-m{grid-area:m;align-self:center;width:auto}
  .conj .c-p{grid-area:p;font-size:var(--fs-1)}
  .conj.persons .c-p{display:none}
  .conj .c-fr{grid-area:fr}
  .conj .c-ph{grid-area:ph}
  .conj .c-en{grid-area:en}
  .conj .c-pl{grid-area:pl;align-self:center;width:auto}
  .cbig{font-size:var(--fs-4)}
}

/* ---------- learn ---------- */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--navy-soft);border-radius:12px;padding:10px 12px;margin:4px 0 8px}
.banner p{margin:0;color:var(--muted);font-size:var(--fs-1)}
.sel{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-1);color:var(--muted)}
select{min-height:44px;border-radius:8px;border:1.5px solid var(--ctl);background:var(--paper);padding:0 10px;max-width:100%}
.lverb{border-bottom:1px solid var(--line)}
.lrow{width:100%;display:flex;align-items:center;gap:8px;min-height:54px;padding:8px 2px;background:none;border:0;text-align:left}
.lname{flex:1;min-width:0;font-size:var(--fs-2)}
.lfr{font-family:var(--serif);font-size:var(--fs-3);color:var(--navy)}
.ldash{color:var(--muted)}
.lchev svg{width:22px;height:22px;color:var(--muted);transition:transform .15s}
.lrow[aria-expanded="true"] .lchev svg{transform:rotate(180deg)}
.lbody{padding:4px 0 18px}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vfr{font-family:var(--serif);font-size:var(--fs-4);color:var(--navy);line-height:1.1}
.vph{color:var(--muted);font-size:var(--fs-2)}
.ven{font-weight:600}
.vmeta{margin:4px 0 0;color:var(--muted);font-size:var(--fs-1)}
.vbtns{margin:10px 0 4px}
.ltense{margin-top:18px}
.lthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lthead h3{font-family:var(--serif);font-weight:600;font-size:var(--fs-3);margin-right:auto}

/* ---------- guide ---------- */
.gentry{padding:16px 0 20px;border-bottom:1px solid var(--line);scroll-margin-top:12px}
.gentry h2{font-family:var(--serif);font-weight:600;font-size:var(--fs-4);color:var(--navy)}
.gentry h3{font-size:var(--fs-2);margin:14px 0 4px}
.gentry p{margin:0;max-width:68ch}
.gentry.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--navy-soft)}to{background:transparent}}
.gtable{border-collapse:collapse;width:100%;margin-top:6px}
.gtable th,.gtable td{text-align:left;vertical-align:top;padding:7px 8px 7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-2)}
.gtable th{white-space:nowrap;font-weight:650}
.gex{font-family:var(--serif);color:var(--navy);white-space:nowrap}
@media (max-width:560px){.gtable tr{display:grid;grid-template-columns:auto 1fr;column-gap:10px;border-bottom:1px solid var(--line);padding:6px 0}.gtable th,.gtable td{border:0;padding:0}.gtable td:last-child{grid-column:2}}

/* ---------- settings ---------- */
.sgroup{margin:20px 0 6px}
.sgroup h2{font-family:var(--serif);font-weight:600;font-size:var(--fs-3);padding-bottom:8px;border-bottom:2px solid var(--navy);margin-bottom:4px}
.sh3{font-size:var(--fs-2);margin:16px 0 8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow.col{flex-direction:column;align-items:stretch}
.stext{flex:1;min-width:0}
.slabel{font-weight:650;display:block}
.shelp{margin:3px 0 0;color:var(--muted);font-size:var(--fs-1)}
.switch{flex:none;width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--navy)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{min-height:44px;padding:0 12px;border-radius:8px;border:1.5px solid var(--ctl);background:var(--paper);font-size:var(--fs-1)}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);font-weight:650}
input[type=range]{width:100%;accent-color:var(--navy);min-height:36px}
details.shelpbox{margin:10px 0;color:var(--muted);font-size:var(--fs-1)}
details.shelpbox summary{cursor:pointer;color:var(--navy);font-weight:600}
details.shelpbox p{margin:8px 0}

/* ---------- dialogs ---------- */
dialog{border:0;border-radius:14px;padding:20px;max-width:min(460px,calc(100vw - 24px));width:100%;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,30,.5)}
dialog h2{font-family:var(--serif);font-weight:600;font-size:var(--fs-3);margin-bottom:10px}
dialog p{margin:8px 0}
dialog fieldset{border:0;margin:10px 0;padding:0}
dialog legend{font-weight:650;margin-bottom:6px;padding:0}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.radio:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.radio input{accent-color:var(--navy);width:18px;height:18px}
.dlgbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.pnote{color:var(--muted);font-size:var(--fs-1)}

/* ---------- stage 3: schedule ---------- */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.subnav button{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ctl);background:var(--paper);font-weight:600;font-size:var(--fs-1)}
.subnav button[aria-current="page"]{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.libnote{margin:0 0 8px;font-size:var(--fs-1);color:var(--muted)}
.rank{font:600 var(--fs-1) var(--ui);color:var(--muted);margin-left:8px}
.vchip .vstat{grid-column:1 / -1;grid-row:auto;justify-self:start;margin-top:4px}
.dots{display:inline-flex;align-items:center;gap:3px;--dot:var(--muted);flex:none}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dot);display:inline-block}
.dots i.on{background:var(--dot)}
.st-new{--dot:var(--muted)}.st-on{--dot:var(--know)}
.dtext{font-size:var(--fs-1);color:var(--muted);margin-left:6px}
.lrow .dots{margin:0 4px}
.todayline{font-family:var(--serif);font-size:var(--fs-3);line-height:1.3;margin:6px 0 8px}
.bigstart{width:100%;min-height:64px;font-size:var(--fs-3);border-radius:14px;margin-top:14px}
.sesshead{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.ssub{display:flex;gap:12px;flex-wrap:wrap;font-size:var(--fs-1);margin-top:6px;color:var(--muted)}
.ssub .c-retry{color:var(--miss);font-weight:650}.ssub .c-done{color:var(--know);font-weight:650}
.parth{font-family:var(--serif);font-weight:600;font-size:var(--fs-3);margin:14px 0 6px}
.learnhead{margin:6px 0 2px;font-weight:650}
.kv{border-collapse:collapse;margin:8px 0;width:100%}
.kv th,.kv td{text-align:left;padding:8px 0;border-bottom:1px solid var(--line);font-weight:500}
.kv td{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;vertical-align:top}
.fc{display:grid;grid-template-columns:7.5em 1fr 4.5em;gap:10px;align-items:center;margin:8px 0;font-size:var(--fs-1)}
.barwrap{height:12px}.bar{height:12px;border-radius:6px;background:var(--navy)}.bar.over{background:var(--miss)}
.fc span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.about p{max-width:68ch;margin:0 0 10px}
.secorder{margin:8px 0 0;padding-left:22px}.secorder li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.simgrid label{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-1);color:var(--muted)}
.simgrid input,.simgrid select{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);padding:0 10px;color:var(--ink);width:100%}
.simtable{max-height:340px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
.simt{border-collapse:collapse;width:100%;font-size:var(--fs-1)}
.simt th,.simt td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.simt th:first-child,.simt td:first-child{text-align:left}
.simt thead th{position:sticky;top:0;background:var(--paper)}
.warnline{color:var(--miss)}
.tag.retry{color:var(--miss);border-color:var(--miss)}
.cue{margin:6px 0 0;color:var(--muted);font-size:var(--fs-2)}
.cue span{font-family:var(--serif);color:var(--navy)}
.cplay.big{margin:36px 0 10px}.cplay.big .play{min-height:64px;padding:0 22px;font-size:var(--fs-2)}.cplay.big .play svg{width:28px;height:28px}
.sprog .ssub{margin-top:4px}
.day{margin:18px 0 6px}.dayh{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-2);margin:0 0 6px}.dayh small{color:var(--muted);font-weight:500;font-size:var(--fs-1)}
.sec{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;margin:8px 0}
.sec.isdone{background:var(--know-soft);border-color:var(--know)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.tick{color:var(--know);font-weight:700}
.vsmall{margin:4px 0 0;font-size:var(--fs-1);color:var(--muted);line-height:1.5}
.vsmall .linkbtn{font-size:inherit}
.hist summary{cursor:pointer;font-weight:650;padding:10px 0}
.vrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.vrow .vfr{flex:1}

.gloss{font-weight:400;color:var(--muted);font-size:var(--fs-1)}
.lthead .gloss{flex:1 1 100%;order:5}
.subs .sub{padding:6px 0;border-bottom:1px solid var(--line)}.subs .sub:last-child{border-bottom:0}
.sline{display:flex;align-items:center;justify-content:space-between;gap:10px}.sfr{font-size:var(--fs-4);font-family:var(--serif)}
.subs .cphon,.subs .cen{margin:2px 0 0}
.pv{border-bottom:1px solid var(--line)}.pv>summary{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}
.pv>summary::-webkit-details-marker{display:none}.pv .fr{font-family:var(--serif);font-size:var(--fs-3)}.pv .ven,.pv .pct{color:var(--muted);font-size:var(--fs-1)}
.pv .pbar{grid-column:1 / -1}.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--know)}
.ptot{margin:10px 0 4px}.prow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0 6px 8px;border-top:1px solid var(--line)}
.prow.off{opacity:.55}.prow small{display:block;color:var(--muted);font-size:var(--fs-1)}.prow .pn{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.chart{display:flex;align-items:flex-end;gap:2px;height:80px;margin:8px 0}.cbar{flex:1;height:100%;display:flex;align-items:flex-end;background:linear-gradient(var(--line),var(--line)) bottom/100% 1px no-repeat}.cbar i{display:block;width:100%;background:var(--know);border-radius:2px 2px 0 0}
.conj tr.speaking td,.card .conj tr.speaking td{background:var(--navy-soft)}
@media (max-width:560px){
  .conj tr.speaking,.card .conj tr.speaking{background:var(--navy-soft)}
  .conj tr.speaking td,.card .conj tr.speaking td{background:none}
}
.rvlist{list-style:none;margin:10px 0 0;padding:0}
.rvrow{padding:12px 8px;border-top:1px solid var(--line);border-radius:8px}
.rvrow:first-child{border-top:0}
.rvrow.speaking{background:var(--navy-soft)}
.rvfr{font-family:var(--serif);font-size:var(--fs-3);line-height:1.3}
.rvmeta{font-size:var(--fs-1);color:var(--muted)}
.rven{margin-top:2px}
.rvbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.libctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.libctl input[type=search],.libctl select{min-height:44px;border:1px solid var(--ctl);border-radius:8px;padding:0 10px;background:var(--paper);color:var(--ink);font:inherit}.libctl input[type=search]{flex:1 1 100%}.libchk{display:flex;align-items:center;gap:6px;min-height:44px}
.tdots{display:inline-flex;gap:3px;margin:0 6px}.sd{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--navy);display:inline-block}.sd-new{border-color:var(--muted)}.sd.sf1{background:conic-gradient(var(--navy) 0 25%,transparent 0)}.sd.sf2{background:conic-gradient(var(--navy) 0 50%,transparent 0)}.sd.sf3{background:conic-gradient(var(--navy) 0 75%,transparent 0)}.sd.sf4{background:color-mix(in srgb,var(--navy) 70%,transparent)}.sd-mastered.sf4{background:var(--navy)}
.ctable{margin-top:12px}.ctablehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 4px;font-weight:650;color:var(--muted)}
.rvverb{border-bottom:1px solid var(--line);padding:4px 0}.rvverb>summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--fs-3)}.rvverb>summary .count{font-size:var(--fs-1)}
.rvtense{margin:4px 0 8px 12px}.rvtense>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:650}
.stag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--line);font-size:var(--fs-1);font-weight:600}.stag.persist{background:var(--miss-soft);color:var(--miss)}.lmeta{color:var(--muted);font-size:var(--fs-1);margin-left:auto}
.grid td.few{color:var(--muted);opacity:.6}.attempts td,.attempts th{padding:2px 8px;font-size:var(--fs-1);text-align:left}
.rvtag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--miss-soft);color:var(--miss);font-size:var(--fs-1);font-weight:700;vertical-align:middle;white-space:nowrap}
.aifix{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 134px);z-index:60;white-space:nowrap;min-height:44px;max-width:calc(100% - 20px);padding:0 14px;border-radius:999px;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);font:inherit;font-size:var(--fs-1);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
.aifix[hidden]{display:none}
.aichips{display:flex;flex-wrap:wrap;gap:8px}
.aichips button{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ctl);background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.aichips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:600}
.rvprog{font-size:var(--fs-1);color:var(--muted);align-self:center}
.todaygo .sechead small{font-weight:400;color:var(--muted)}
.blist{list-style:none;padding:0;margin:6px 0}.blist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div id="fatal" class="fatal" hidden></div>

<!-- TODAY -->
<section class="screen" id="scr-today" hidden>
  <header class="pagehead row"><div><h1>Today</h1><p class="lede" id="todayDate"></p></div><button class="iconbtn gear" data-tab="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></header>
  <div class="notices"></div>
  <div id="todayBody"></div>
</section>

<!-- STATS -->
<section class="screen" id="scr-stats" hidden>
  <header class="pagehead"><h1>Progress</h1><p class="lede">What you remember, where you slip, and what is coming.</p></header>
  <div id="statsBody"></div>
</section>

<!-- LIBRARY -->
<section class="screen" id="scr-library" hidden>
  <header class="pagehead"><h1>Library</h1><p class="lede" id="libLede"></p></header>
  <nav class="subnav" aria-label="Library"><button data-tab="library">Verbs</button><button data-tab="guide">Tense guide</button></nav>
  <p class="libnote">Practice here never changes your schedule, progress or time averages.</p>
  <div class="notices"></div>
  <div id="problems"></div>
  <div id="resume"></div>
  <div id="reviewSec"></div>
  <div class="libctl">
    <input id="libSearch" type="search" placeholder="Search French or English" aria-label="Search verbs" autocomplete="off">
    <select id="libType" aria-label="Type"><option value="all">All types</option><option value="irregular">Irregular</option><option value="er">-er</option><option value="ir">-ir</option><option value="re">-re</option></select>
    <select id="libStatus" aria-label="Status"><option value="all">Any status</option><option value="new">New</option><option value="learning">Learning</option><option value="reviewing">Reviewing</option><option value="retained">Retained</option><option value="mastered">Mastered</option><option value="persistent">Persistent mistake</option></select>
    <select id="libTense" aria-label="Tense"><option value="">Any tense</option></select>
    <select id="libDue" aria-label="Due"><option value="any">Any due date</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="week">Due this week</option></select>
    <select id="libSort" aria-label="Sort"><option value="rank">Sort: importance</option><option value="weak">Sort: weakest first</option><option value="due">Sort: due soonest</option></select>
    <label class="libchk"><input type="checkbox" id="libReview"> To review</label>
  </div>
  <p class="shelp" id="libCount"></p>
  <div id="libList"></div>
</section>

<!-- STUDY -->
<section class="screen" id="scr-study" hidden>
  <div class="studybar">
    <button class="iconbtn" id="studyBack" aria-label="Back to Library"></button>
    <div class="sprog">
      <div class="sprog-text"><b id="sTitle"></b><span class="score" id="sScore"></span></div>
      <div class="track"><div class="fill" id="sFill"></div></div>
      <div class="ssub" id="sSub" hidden></div>
    </div>
    <button class="iconbtn" id="undoBtn" aria-label="Undo last card" title="Undo (U)"></button>
  </div>
  <div class="quick" role="toolbar" aria-label="Quick settings">
    <button class="qbtn" id="qAuto"></button>
    <button class="qbtn" id="qDir"></button>
    <button class="qbtn" id="qPhon"></button>
    <button class="qbtn" id="qMic"></button>
  </div>
  <p class="micnote" id="micNote" hidden></p>
  <div class="cardwrap"><article class="card" id="card" aria-live="polite"></article></div>
  <div class="actions" id="actions"></div>
  <p class="legend"><kbd>Space</kbd>show answer <kbd>1</kbd>again <kbd>2</kbd>hard <kbd>3</kbd>good <kbd>R</kbd>replay <kbd>U</kbd>undo</p>
</section>

<!-- ROUND SUMMARY -->
<section class="screen" id="scr-summary" hidden>
  <header class="pagehead"><h1 id="sumTitle"></h1><p class="lede" id="sumText"></p></header>
  <div id="sumList"></div>
  <div class="btnrow wrap" id="sumActions" style="margin-top:18px"></div>
</section>

<!-- TENSE GUIDE -->
<section class="screen" id="scr-guide" hidden>
  <header class="pagehead"><h1>Tense guide</h1><p class="lede">How each tense is formed and when it’s used.</p></header>
  <nav class="subnav" aria-label="Library"><button data-tab="library">Verbs</button><button data-tab="guide">Tense guide</button></nav>
  <div id="guideList"></div>
</section>

<!-- SETTINGS -->
<section class="screen" id="scr-settings" hidden>
  <header class="pagehead row"><h1>Settings</h1><button class="ghost sm" data-tab="today">Back to Today</button></header>
  <div class="notices"></div>
  <div id="settingsBody"></div>
</section>

<nav class="tabs" id="tabs" aria-label="Main" hidden>
  <button data-tab="today">Today</button>
  <button data-tab="library">Library</button>
  <button data-tab="stats">Progress</button>
</nav>

<dialog id="confirmDlg" aria-labelledby="cTitle">
  <h2 id="cTitle"></h2>
  <div id="cText"></div>
  <div class="dlgbtns"><button class="ghost" id="cCancel">Cancel</button><button class="primary" id="cOk">OK</button></div>
</dialog>

<dialog id="practiseDlg" aria-labelledby="pTitle">
  <h2 id="pTitle">Practise</h2>
  <fieldset>
    <legend>Cards</legend>
    <label class="radio"><input type="radio" name="pcontent" value="main">Main card only</label>
    <label class="radio"><input type="radio" name="pcontent" value="key">Main card + key forms</label>
    <label class="radio"><input type="radio" name="pcontent" value="full">Main card + full tables</label>
  </fieldset>
  <fieldset>
    <legend>Order</legend>
    <label class="radio"><input type="radio" name="porder" value="order">In order</label>
    <label class="radio"><input type="radio" name="porder" value="shuffle">Shuffled</label>
  </fieldset>
  <p class="pnote" id="pNote"></p>
  <div class="dlgbtns"><button class="ghost" id="pCancel">Cancel</button><button class="primary" id="pStart">Start</button></div>
</dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<button id="aiFix" class="aifix" hidden>Sounded wrong? Try another voice</button>
<script>
  // Catch errors inside verbs.js so the app can say what went wrong.
  window.__verbsErrors = [];
  window.addEventListener("error", function (e) {
    if (e && e.filename && /verbs\.js/i.test(e.filename)) {
      window.__verbsErrors.push((e.message || "error") + (e.lineno ? " (line " + e.lineno + ")" : ""));
    }
  });
</script>
<script src="verbs.js" onerror="window.__verbsMissing = true"></script>
<script src="js/core.js"></script>
<script src="js/conjugate.js"></script>
<script src="js/audio.js"></script>
<script src="js/study.js"></script>
<script src="js/screens.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
